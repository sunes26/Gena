<!--extension\popup.html - Restricted Page Warning Only -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gena</title>
  <link rel="stylesheet" href="popup.css">
  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ✨ 제한된 페이지 경고 (간소화된 버전) -->
  <div id="restrictedWarning" class="restricted-warning-container">
    <div class="warning-icon-large">🚫</div>
    <h2 id="warningTitle" class="warning-title" data-i18n="restrictedPageTitle">제한된 페이지</h2>
    <p id="warningMessage" class="warning-message" data-i18n="restrictedPageMessage">이 페이지는 보안상의 이유로 요약할 수 없습니다</p>
  </div>

  <!-- 스크립트 로드 순서 -->
  
  <!-- 1️⃣ CONFIG: 환경 설정 (가장 먼저 로드!) -->
  <script src="config.js"></script>
  
  <!-- 2️⃣ 유틸리티 모듈 -->
  <script src="modules/utils.js"></script>
  <script src="modules/security.js"></script>
  <script src="modules/error-handler.js"></script>
  
  <!-- 3️⃣ 핵심 모듈 (의존성 순서대로) -->
  <script src="modules/token-manager.js"></script>
  <script src="modules/api-client.js"></script>
  <script src="modules/auth-manager.js"></script>
  
  <!-- 4️⃣ 서비스 모듈 -->
  <script src="modules/storage-manager.js"></script>
  <script src="modules/settings-manager.js"></script>
  <script src="modules/language-manager.js"></script>
  <script src="modules/usage-manager.js"></script>
  
  <!-- 5️⃣ UI 모듈 -->
  <script src="modules/ui-components.js"></script>
  <script src="modules/ui-manager.js"></script>
  
  <!-- 6️⃣ 메인 스크립트 (마지막!) -->
  <script src="popup.js"></script>
</body>
</html>
